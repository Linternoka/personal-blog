# Decap CMS 配置：图形界面编辑博客内容
# 后台地址：/admin/（部署后为 /personal-blog/admin/）

backend:
  name: github
  repo: Linternoka/personal-blog
  branch: main
  # 认证经自托管的 Netlify Function OAuth 代理中转
  # （Netlify 已废弃旧 OAuth 服务 api.netlify.com/auth，故自建 proxy）
  # Decap 会自动拼 /auth 和 /callback，base_url 只写主域（origin 需精确匹配）
  base_url: https://spontaneous-frangollo-baf0ae.netlify.app

# 媒体文件（文章配图）保存到 public/images/，引用路径为 /images/xxx
media_folder: "public/images"
public_folder: "/images"

# 界面语言：简体中文
locale: zh_Hans

collections:
  - name: "posts"
    label: "文章"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    editor:
      # 开启实时预览：右侧即时渲染 Markdown 效果（样式见 preview.css）
      preview: true
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "摘要", name: "description", widget: "text", required: false }
      - {
          label: "分类",
          name: "category",
          widget: "select",
          options: ["杂谈", "评价", "记录", "其他"],
          default: "杂谈",
        }
      - {
          label: "标签",
          name: "tags",
          widget: "list",
          default: [],
          required: false,
        }
      - {
          label: "草稿（勾选则暂不发布）",
          name: "draft",
          widget: "boolean",
          required: false,
          default: false,
        }
      - { label: "正文", name: "body", widget: "markdown" }

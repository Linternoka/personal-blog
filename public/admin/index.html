<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>内容管理 · 废书库修缮委员会</title>
    <!-- 后台 UI 定制：与主站统一（浅色深青绿 / 深色青绿，跟随系统，可手动切换）
         ?v= 版本号用于强制 CDN 更新缓存 -->
    <link rel="stylesheet" href="./custom.css?v=9" />
  </head>
  <body>
    <!-- Decap CMS 管理后台入口（静态页面，随站点部署） -->
    <script src="https://unpkg.com/decap-cms@^3.4.2/dist/decap-cms.js"></script>
    <script>
      // 注册文章实时预览样式（自动适配子路径部署：GitHub Pages 下为 /<repo>/admin/preview.css）
      (function () {
        try {
          var basePath = window.location.pathname.replace(/\/admin\/.*$/, "");
          CMS.registerPreviewStyle(basePath + "/admin/preview.css?v=9");
        } catch (e) {
          /* 预览样式注册失败不影响主功能 */
        }
      })();
    </script>
    <script>
      // 后台工具：手动深浅色切换 + 返回前台（预览 iframe 仍跟随系统，Decap 机制限制）
      (function () {
        try {
          var saved = localStorage.getItem("decap-theme");
          if (saved === "dark" || saved === "light") {
            document.documentElement.setAttribute("data-theme", saved);
          }
          var isDark = function () {
            return (
              document.documentElement.getAttribute("data-theme") === "dark" ||
              (!document.documentElement.getAttribute("data-theme") &&
                window.matchMedia("(prefers-color-scheme: dark)").matches)
            );
          };
          var base = window.location.pathname.replace(/\/admin\/.*$/, "") + "/";
          var box = document.createElement("div");
          box.style.cssText =
            "position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;gap:8px;";
          var mkBtn = function (html, title, onClick) {
            var b = document.createElement("button");
            b.type = "button";
            b.title = title;
            b.setAttribute("aria-label", title);
            b.innerHTML = html;
            b.style.cssText =
              "width:38px;height:38px;border-radius:50%;border:1px solid var(--decap-line);background:var(--decap-bg);color:var(--decap-gold);cursor:pointer;font-size:16px;box-shadow:0 2px 12px rgba(0,0,0,.18);";
            b.addEventListener("click", onClick);
            return b;
          };
          var homeBtn = mkBtn("↩", "返回前台", function () {
            window.location.href = base;
          });
          var themeBtn = mkBtn("☾", "切换深色 / 浅色", function () {
            var next = isDark() ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("decap-theme", next);
            themeBtn.innerHTML = isDark() ? "☀" : "☾";
          });
          var paint = function () {
            themeBtn.innerHTML = isDark() ? "☀" : "☾";
          };
          paint();
          box.appendChild(homeBtn);
          box.appendChild(themeBtn);
          document.body.appendChild(box);
        } catch (e) {
          /* 忽略 */
        }
      })();
    </script>
    <script>
      // 预览 iframe 主题同步：让右侧实时预览跟随后台手动切换的深浅色
      // （Decap 预览 iframe 是独立文档，默认只跟随系统，这里把 html[data-theme] 同步进去）
      (function () {
        try {
          var applyPreviewTheme = function () {
            var theme =
              document.documentElement.getAttribute("data-theme") ||
              (window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light");
            var frames = document.querySelectorAll("#nc-root iframe, iframe");
            for (var i = 0; i < frames.length; i++) {
              try {
                var d = frames[i].contentDocument;
                if (d && d.documentElement) {
                  d.documentElement.setAttribute("data-theme", theme);
                }
              } catch (e) {
                /* 跨域/未加载完时忽略 */
              }
            }
          };
          // 主题切换按钮点击后同步（含初始）
          document.addEventListener("click", function () {
            window.setTimeout(applyPreviewTheme, 80);
          });
          // 监听 iframe 出现/重建（Decap 切文章、切模式会重建预览）
          var mo = new MutationObserver(function () {
            applyPreviewTheme();
          });
          mo.observe(document.body, { childList: true, subtree: true });
          applyPreviewTheme();
          window.addEventListener("load", applyPreviewTheme);
          // 兜底：预览每次编辑会重渲染，低频轮询保证主题不丢失
          window.setInterval(applyPreviewTheme, 1500);
        } catch (e) {
          /* 忽略 */
        }
      })();
    </script>
  </body>
</html>

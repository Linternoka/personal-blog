<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>内容管理 · 废书库修缮委员会</title>
    <!-- 后台 UI 定制：与主站统一（浅色深青绿 / 深色青绿，跟随系统，可手动切换）
         ?v= 版本号用于强制 CDN 更新缓存 -->
    <link rel="stylesheet" href="./custom.css?v=4" />
  </head>
  <body>
    <!-- Decap CMS 管理后台入口（静态页面，随站点部署） -->
    <script src="https://unpkg.com/decap-cms@^3.4.2/dist/decap-cms.js"></script>
    <script>
      // 注册文章实时预览样式（自动适配子路径部署：GitHub Pages 下为 /<repo>/admin/preview.css）
      (function () {
        try {
          var basePath = window.location.pathname.replace(/\/admin\/.*$/, "");
          CMS.registerPreviewStyle(basePath + "/admin/preview.css?v=4");
        } catch (e) {
          /* 预览样式注册失败不影响主功能 */
        }
      })();
    </script>
    <script>
      // 后台工具：手动深浅色切换 + 返回前台（预览 iframe 仍跟随系统，Decap 机制限制）
      (function () {
        try {
          var saved = localStorage.getItem("decap-theme");
          if (saved === "dark" || saved === "light") {
            document.documentElement.setAttribute("data-theme", saved);
          }
          var isDark = function () {
            return (
              document.documentElement.getAttribute("data-theme") === "dark" ||
              (!document.documentElement.getAttribute("data-theme") &&
                window.matchMedia("(prefers-color-scheme: dark)").matches)
            );
          };
          var base = window.location.pathname.replace(/\/admin\/.*$/, "") + "/";
          var box = document.createElement("div");
          box.style.cssText =
            "position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;gap:8px;";
          var mkBtn = function (html, title, onClick) {
            var b = document.createElement("button");
            b.type = "button";
            b.title = title;
            b.setAttribute("aria-label", title);
            b.innerHTML = html;
            b.style.cssText =
              "width:38px;height:38px;border-radius:50%;border:1px solid var(--decap-line);background:var(--decap-bg);color:var(--decap-gold);cursor:pointer;font-size:16px;box-shadow:0 2px 12px rgba(0,0,0,.18);";
            b.addEventListener("click", onClick);
            return b;
          };
          var homeBtn = mkBtn("↩", "返回前台", function () {
            window.location.href = base;
          });
          var themeBtn = mkBtn("☾", "切换深色 / 浅色", function () {
            var next = isDark() ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("decap-theme", next);
            themeBtn.innerHTML = isDark() ? "☀" : "☾";
          });
          var paint = function () {
            themeBtn.innerHTML = isDark() ? "☀" : "☾";
          };
          paint();
          box.appendChild(homeBtn);
          box.appendChild(themeBtn);
          document.body.appendChild(box);
        } catch (e) {
          /* 忽略 */
        }
      })();
    </script>
  </body>
</html>

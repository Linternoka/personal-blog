<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- 深色圆角底：favicon 独立渲染，不依赖 CSS 变量 -->
  <rect width="600" height="600" rx="120" fill="#0a0e0d"/>
  <g transform="translate(300,300)">
    <!-- 外圈轨道 -->
    <circle r="260" fill="none" stroke="#e8eae9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 5 条斜轨道 -->
    <g fill="none" stroke="#e8eae9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-130" r="130"/>
      <circle cx="0" cy="-130" r="130" transform="rotate(72)"/>
      <circle cx="0" cy="-130" r="130" transform="rotate(144)"/>
      <circle cx="0" cy="-130" r="130" transform="rotate(216)"/>
      <circle cx="0" cy="-130" r="130" transform="rotate(288)"/>
    </g>
    <!-- 星形核心 -->
    <polygon points="0,-110 32,-34 105,-34 43,13 64,90 0,55 -64,90 -43,13 -105,-34 -32,-34"
             fill="rgba(127,220,198,0.16)" stroke="#e8eae9" stroke-width="8" stroke-linejoin="round"/>
    <!-- 中层圆环 + 虚线环 -->
    <circle r="180" fill="none" stroke="#e8eae9" stroke-width="8"/>
    <circle r="180" fill="none" stroke="#7fdcc6" stroke-width="6" stroke-dasharray="30 22"/>
    <!-- 内层 5 个椭圆轨道 -->
    <g fill="none" stroke="#7fdcc6" stroke-width="6">
      <ellipse rx="60" ry="15" transform="rotate(0)"/>
      <ellipse rx="60" ry="15" transform="rotate(72)"/>
      <ellipse rx="60" ry="15" transform="rotate(144)"/>
      <ellipse rx="60" ry="15" transform="rotate(216)"/>
      <ellipse rx="60" ry="15" transform="rotate(288)"/>
    </g>
    <!-- 中心圆核 -->
    <circle r="25" fill="rgba(127,220,198,0.16)" stroke="#e8eae9" stroke-width="8"/>
    <circle r="12" fill="#7fdcc6"/>
  </g>
</svg>
